
name: Java Ant Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download JUnit test libraries
        run: |
          mkdir -p .github/test-libs
          curl -fL https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar \
            -o .github/test-libs/junit-4.13.2.jar
          curl -fL https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar \
            -o .github/test-libs/hamcrest-core-1.3.jar

      - name: Build and run tests
        run: |
          ant -noinput clean test \
            -Dlibs.junit_4.classpath=.github/test-libs/junit-4.13.2.jar \
            -Dlibs.hamcrest.classpath=.github/test-libs/hamcrest-core-1.3.jar
